<style>

    --brand:#ff6a3d; --brand2:#ffb347; --accent:#4f8cff; --accent2:#22d3a6;
    --sourced:#7c8db5; --screening:#4f8cff; --interview:#a78bfa; --offer:#ffb347; --hired:#22d3a6;
    --danger:#f0506e;

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}

  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;

  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 14px;border-radius:10px;
    font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#26160c}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12px}

  .tab{padding:9px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;

  .tab .cnt{background:var(--panel2);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
  .tab:hover{color:var(--ink);border-color:var(--accent)}
  .tab.active{background:linear-gradient(135deg,rgba(255,106,61,.18),rgba(79,140,255,.14));border-color:var(--brand);color:var(--ink)}
  .tab.active .cnt{background:var(--brand);color:#26160c}

  .chip.urgent{color:#ffc7b3;border-color:rgba(255,106,61,.4);background:rgba(255,106,61,.12)}
  .chip.hold{color:#ffe0a3;border-color:rgba(255,179,71,.35);background:rgba(255,179,71,.1)}

  .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .x:hover{color:var(--ink)}

  .jdbody p{color:var(--muted);margin:6px 0}

  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{margin-top:30px;text-align:center;color:var(--faint);font-size:11.5px}
  input[type=file]{display:none}
</style>
</head>

/* ================= State ================= */
let DB=null, activeCountry, openRoleId=null, dragCand=null;

/* ================= Persistence ================= */
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(DB)); }catch(e){} }
function loadSaved(){ try{ const s=localStorage.getItem(LS_KEY); if(s){ const d=JSON.parse(s); if(d&&Array.isArray(d.countries)) return d; } }catch(e){} return null; }
function bumpUid(){ let mx=1000; (DB.countries||[]).forEach(c=>{ (c.roles||[]).forEach(r=>{ const m=(''+r.id).match(/\d+/); if(m) mx=Math.max(mx,+m[0]); (r.candidates||[]).forEach(x=>{ const mm=(''+x.id).match(/\d+/); if(mm) mx=Math.max(mx,+mm[0]); }); }); }); uid=mx; }
function resetSeed(){ if(confirm('Reset to the built-in sample data? This clears your saved changes in this browser.')){ DB=seed(); activeCountry=DB.countries[0].id; openRoleId=null; save(); render(); toast('Reset to sample data'); } }

/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
const countryById=id=>DB.countries.find(c=>c.id===id);
const roleById=(c,id)=>c.roles.find(r=>r.id===id);
function allRoles(){ return DB.countries.flatMap(c=>c.roles.map(r=>({c,r}))); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }
function statusClass(s){ return s==='Urgent'?'urgent':s==='On-hold'?'hold':'open'; }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================= KPIs ================= */
function renderKPIs(){
  const roles=allRoles().map(x=>x.r); let seats=0,cands=0,invited=0,inInt=0,offers=0,hired=0;
  roles.forEach(r=>{ seats+=(r.status==='On-hold'?0:r.count); (r.candidates||[]).forEach(c=>{ cands++;
    if(c.invited)invited++; if(c.stage==='Interview')inInt++; if(c.stage==='Offer')offers++; if(c.stage==='Hired')hired++; }); });
  const data=[{v:roles.length,l:'Open Roles',c:'var(--accent)'},{v:seats,l:'Seats to Fill',c:'var(--brand)'},
    {v:cands,l:'Candidates',c:'var(--sourced)'},{v:invited,l:'Invited',c:'var(--brand2)'},{v:inInt,l:'In Interview',c:'var(--interview)'},
    {v:offers,l:'Offers Out',c:'var(--offer)'},{v:hired,l:'Hired',c:'var(--hired)'}];
  $('#kpis').innerHTML=data.map(k=>`<div class="kpi"><div class="bar" style="background:${k.c}"></div><div class="v">${k.v}</div><div class="l">${k.l}</div></div>`).join('');
}
/* ================= Tabs ================= */
function renderTabs(){ $('#tabs').innerHTML=DB.countries.map(c=>`<div class="tab ${c.id===activeCountry?'active':''}" onclick="selectCountry('${c.id}')">
  <span class="flag">${c.flag}</span>${c.name}<span class="cnt">${c.roles.length}</span>${c.ledBy==='direct'?'<span class="badge">direct</span>':''}</div>`).join(''); }
function selectCountry(id){ activeCountry=id; openRoleId=null; render(); }

/* ================= Country view ================= */
function renderCountry(){
  const c=countryById(activeCountry);
  const seats=c.roles.reduce((a,r)=>a+(r.status==='On-hold'?0:r.count),0);
  const cands=c.roles.reduce((a,r)=>a+r.candidates.length,0);
  const rolesHTML=c.roles.length?c.roles.map(r=>roleCard(c,r)).join(''):`<div class="empty">No open roles for ${c.name} yet. Click "Add Role" to create one.</div>`;
  $('#view').innerHTML=`<div class="country-head"><div class="ch-left"><div class="ch-flag">${c.flag}</div><div>
      <h2>${c.name}</h2><div class="lead">${c.ledBy==='direct'?'Led directly by <b>Boonchoo Malhotra</b>':'Country Head: <b>'+c.head+'</b>'}</div></div></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="pill">${c.roles.length} roles</span><span class="pill">${seats} seats</span>
      <span class="pill">${cands} candidates</span><button class="btn primary sm" onclick="openRole(null,'${c.id}')">＋ Role</button></div></div>
    <div class="roles">${rolesHTML}</div>`;
}
function roleCard(c,r){
  const byStage=STAGES.map(s=>r.candidates.filter(x=>x.stage===s.key).length);
  const funnel=STAGES.map((s,i)=>byStage[i]?`<span style="flex:${byStage[i]};background:${s.color}"></span>`:'').join('');
  const invN=r.candidates.filter(x=>x.invited).length;
  return `<div class="role" onclick="openBoard('${c.id}','${r.id}')">
    <div class="rtitle">${r.title}</div><div class="rfunc">${r.func} · ${r.level} · ${r.count} seat${r.count>1?'s':''}</div>
    <div class="rmeta"><span class="chip ${statusClass(r.status)}">${r.status}</span><span class="chip">HM: ${r.hm.split(' ')[0]}</span>
      <span class="chip">Target: ${fmtDate(r.target)}</span>${r.jd?'<span class="chip jd">JD</span>':''}${invN?`<span class="chip inv">✉ ${invN} invited</span>`:''}</div>
    <div class="rstats"><div class="cands"><b>${r.candidates.length}</b> candidate${r.candidates.length!==1?'s':''}${invN?` · ${invN} invited`:''}</div>
      <div class="funnel" title="Pipeline by stage">${funnel||'<span style="flex:1;background:var(--panel2)"></span>'}</div></div></div>`;
}
/* ================= Board ================= */
function openBoard(cid,rid){ activeCountry=cid; openRoleId=rid; render(); }
function closeBoard(){ openRoleId=null; render(); }
function renderBoard(){
  const c=countryById(activeCountry), r=roleById(c,openRoleId);
  if(!r){ openRoleId=null; return render(); }
  const cols=STAGES.map(s=>{ const cards=r.candidates.filter(x=>x.stage===s.key);
    return `<div class="col" data-stage="${s.key}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${s.key}')">
      <h3><span><span class="dot" style="background:${s.color}"></span>${s.key}</span><span class="cc">${cards.length}</span></h3>
      ${cards.map(x=>candCard(x)).join('')}<button class="addc" onclick="openCand('${r.id}',null,'${s.key}')">＋ candidate</button></div>`; }).join('');
  $('#view').innerHTML=`<div class="board-head"><div class="back" onclick="closeBoard()">← ${c.flag} ${c.name}</div></div>
    <div class="country-head" style="margin-bottom:16px"><div class="ch-left"><div>
      <h2 style="font-size:19px">${r.title}</h2>
      <div class="lead">${r.func} · ${r.level} · ${r.count} seat${r.count>1?'s':''} · HM <b>${r.hm}</b> · target <b>${fmtDate(r.target)}</b></div></div></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="chip ${statusClass(r.status)}">${r.status}</span>
        ${r.jd?`<button class="btn ghost sm" onclick="viewJD('${r.id}')">📄 View JD</button>`:''}
        <button class="btn ghost sm" onclick="openRole('${r.id}')">✎ Edit role</button>
        <button class="btn primary sm" onclick="openCand('${r.id}',null,'Sourced')">＋ Candidate</button></div></div>
    <div class="board">${cols}</div>`;
}
function candCard(x){
  const li=x.linkedin?`<a class="li" href="${esc(x.linkedin)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">in ↗</a>`:'';
  const inv=x.invited?`<span class="ibadge" title="Invitation sent">✉ Invited ${fmtDate(x.invited)}</span>`:'';
  return `<div class="card" draggable="true" data-id="${x.id}" ondragstart="dragStart(event,'${x.id}')" ondragend="dragEnd(event)">
    <div class="cn">${esc(x.name)}<span class="edit" onclick="event.stopPropagation();editCandFind('${x.id}')">edit</span></div>
    <div class="cr">${esc(x.role||'')}${x.source?' · '+esc(x.source):''} ${li}</div>
    ${inv}
    ${x.notes?`<div class="cr" style="margin-top:6px;color:var(--faint)">"${esc(x.notes)}"</div>`:''}</div>`;
}
/* ================= JD viewer ================= */
function viewJD(rid){ let c,r; for(const cc of DB.countries){ const rr=cc.roles.find(x=>x.id===rid); if(rr){c=cc;r=rr;break;} }
  if(!r||!r.jd) return; const jd=r.jd;
  const li=arr=>'<ul>'+arr.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>';
  showModal(`<div class="mh"><h3>${esc(r.title)} — ${c.flag} ${c.name}</h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="jdbody"><p>${esc(jd.summary)}</p>
      <h4>Key responsibilities</h4>${li(jd.resp.concat(['Use modern AI tools (Claude, ChatGPT, etc.) to work faster and build simple automations.']))}
      <h4>Requirements</h4>${li(jd.req.concat(['AI-first mindset — comfortable using Claude / ChatGPT day-to-day to speed up work and automate tasks.']))}
      <p style="margin-top:16px;font-size:12px">Full job description in the repo: <b>/roles/</b></p></div>
    <div class="mf"><span></span><button class="btn primary" onclick="closeModal()">Close</button></div>`,true);
}
/* ================= Drag & drop ================= */
function dragStart(e,id){ dragCand=id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function dragEnd(e){ e.currentTarget.classList.remove('dragging'); }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function drop(e,stage){ e.preventDefault(); e.currentTarget.classList.remove('drag-over'); if(!dragCand) return;
  const c=countryById(activeCountry), r=roleById(c,openRoleId), cand=r.candidates.find(x=>x.id===dragCand);
  if(cand&&cand.stage!==stage){ cand.stage=stage; toast(`${cand.name} → ${stage}`); } dragCand=null; render(); }
/* ================= Role modal ================= */
function openRole(rid,forceCountry){
  const editing=!!rid; let c,r;
  if(editing){ for(const cc of DB.countries){ const rr=cc.roles.find(x=>x.id===rid); if(rr){c=cc;r=rr;break;} } }
  else { c=countryById(forceCountry||activeCountry); r={title:'',func:'Sales',level:'Mid',count:1,status:'Open',hm:c.head,target:''}; }
  const opts=(arr,val)=>arr.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('');
  const cOpts=DB.countries.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.flag} ${x.name}</option>`).join('');
  showModal(`<div class="mh"><h3>${editing?'Edit Role':'Add Role'}</h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="mb"><div><label class="fl">Role title</label><input id="f_title" value="${esc(r.title)}" placeholder="e.g. Payroll Functional Consultant"></div>
      <div><label class="fl">Country</label><select id="f_country">${cOpts}</select></div>
      <div class="grid2"><div><label class="fl">Function</label><select id="f_func">${opts(FUNCTIONS,r.func)}</select></div>
        <div><label class="fl">Level</label><input id="f_level" value="${esc(r.level)}" placeholder="e.g. Mid, Senior"></div></div>
      <div class="grid2"><div><label class="fl">Seats</label><input id="f_count" type="number" min="1" value="${r.count}"></div>
        <div><label class="fl">Status</label><select id="f_status">${opts(STATUSES,r.status)}</select></div></div>
      <div class="grid2"><div><label class="fl">Hiring manager</label><input id="f_hm" value="${esc(r.hm)}"></div>
        <div><label class="fl">Target close</label><input id="f_target" type="date" value="${r.target||''}"></div></div></div>
    <div class="mf">${editing?`<button class="btn del" onclick="deleteRole('${rid}')">Delete</button>`:'<span></span>'}
      <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveRole(${editing?`'${rid}'`:'null'})">Save</button></div></div>`);
}
function saveRole(rid){
  const data={title:$('#f_title').value.trim()||'Untitled role',func:$('#f_func').value,level:$('#f_level').value.trim()||'Mid',
    count:Math.max(1,parseInt($('#f_count').value)||1),status:$('#f_status').value,hm:$('#f_hm').value.trim()||'—',target:$('#f_target').value};
  const destC=countryById($('#f_country').value);
  if(rid){ let srcC,r; for(const cc of DB.countries){ const rr=cc.roles.find(x=>x.id===rid); if(rr){srcC=cc;r=rr;break;} }
    Object.assign(r,data); if(srcC!==destC){ srcC.roles=srcC.roles.filter(x=>x.id!==rid); destC.roles.push(r); } activeCountry=destC.id; }
  else { destC.roles.push({id:nid(),...data,candidates:[]}); activeCountry=destC.id; }
  closeModal(); toast('Role saved'); render();
}
function deleteRole(rid){ for(const cc of DB.countries){ const i=cc.roles.findIndex(x=>x.id===rid); if(i>-1){ cc.roles.splice(i,1); break; } }
  openRoleId=null; closeModal(); toast('Role deleted'); render(); }
/* ================= Candidate modal ================= */
function editCandFind(cid){ for(const cc of DB.countries){ for(const r of cc.roles){ if(r.candidates.find(x=>x.id===cid)){ openCand(r.id,cid); return; } } } }
function openCand(rid,cid,stage){
  let r; for(const cc of DB.countries){ const rr=cc.roles.find(x=>x.id===rid); if(rr){r=rr;break;} }
  const editing=!!cid; const cand=editing?r.candidates.find(x=>x.id===cid):{name:'',role:'',stage:stage||'Sourced',source:'LinkedIn',notes:'',linkedin:'',invited:''};
  const opts=(arr,val)=>arr.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('');
  showModal(`<div class="mh"><h3>${editing?'Edit Candidate':'Add Candidate'}</h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="mb"><div><label class="fl">Name</label><input id="c_name" value="${esc(cand.name)}" placeholder="Candidate name"></div>
      <div class="grid2"><div><label class="fl">Role tag</label><input id="c_role" value="${esc(cand.role)}" placeholder="e.g. Payroll"></div>
        <div><label class="fl">Stage</label><select id="c_stage">${opts(STAGES.map(s=>s.key),cand.stage)}</select></div></div>
      <div><label class="fl">Source</label><select id="c_source">${opts(['LinkedIn','Referral','Agency','Job board','Inbound','Executive search'],cand.source)}</select></div>
      <div><label class="fl">LinkedIn URL</label><input id="c_li" value="${esc(cand.linkedin||'')}" placeholder="https://linkedin.com/in/…"></div>
      <div class="grid2"><div><label class="fl">Invitation sent on</label><input id="c_inv" type="date" value="${cand.invited||''}"></div>
        <div><label class="fl">&nbsp;</label><button class="btn sm" style="width:100%" onclick="document.getElementById('c_inv').value=todayISO()">✉ Mark invited today</button></div></div>
      <div><label class="fl">Notes</label><textarea id="c_notes" placeholder="Latest status, next step...">${esc(cand.notes)}</textarea></div></div>
    <div class="mf">${editing?`<button class="btn del" onclick="deleteCand('${rid}','${cid}')">Delete</button>`:'<span></span>'}
      <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveCand('${rid}',${editing?`'${cid}'`:'null'})">Save</button></div></div>`);
}
function saveCand(rid,cid){
  let r; for(const cc of DB.countries){ const rr=cc.roles.find(x=>x.id===rid); if(rr){r=rr;break;} }
  const data={name:$('#c_name').value.trim()||'Unnamed',role:$('#c_role').value.trim(),stage:$('#c_stage').value,
    source:$('#c_source').value,linkedin:$('#c_li').value.trim(),invited:$('#c_inv').value,notes:$('#c_notes').value.trim()};
  if(cid){ Object.assign(r.candidates.find(x=>x.id===cid),data); } else { r.candidates.push({id:nid(),...data}); }
  openRoleId=rid; closeModal(); toast('Candidate saved'); render();
}
function deleteCand(rid,cid){ let r; for(const cc of DB.countries){ const rr=cc.roles.find(x=>x.id===rid); if(rr){r=rr;break;} }
  r.candidates=r.candidates.filter(x=>x.id!==cid); closeModal(); toast('Candidate removed'); render(); }
/* ================= Modal plumbing ================= */
function showModal(html,wide){ const o=$('#overlay'); o.innerHTML=`<div class="modal${wide?' wide':''}">${html}</div>`; o.classList.add('show'); }
function closeModal(){ $('#overlay').classList.remove('show'); $('#overlay').innerHTML=''; }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
/* ================= Export / import ================= */
function exportData(){ const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sea-hiring-pipeline.json'; a.click(); URL.revokeObjectURL(a.href); toast('Pipeline exported'); }
function importFile(){ $('#fileInput').click(); }
function handleFile(e){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d&&Array.isArray(d.countries)){ DB=d; bumpUid(); activeCountry=DB.countries[0]?.id; openRoleId=null; save(); render(); toast('Pipeline imported'); } else toast('Invalid file'); }catch(err){ toast('Could not read file'); } };
  rd.readAsText(f); e.target.value=''; }
/* ================= Render ================= */
function render(){ save(); renderKPIs(); renderTabs(); if(openRoleId) renderBoard(); else renderCountry();
  $('#foot').innerHTML='Auto-saves to this browser. <b>Export</b> to back up or move machines · <b>Import</b> to restore · drag candidate cards between stages. Built for Boonchoo · HONO SEA.'; }
/* ================= Init ================= */
(function init(){ const saved=loadSaved(); if(saved){ DB=saved; bumpUid(); } else { DB=seed(); } activeCountry=DB.countries[0].id; render(); })();
</script>
</body>
